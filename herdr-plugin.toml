id = "seankao31.herdr-autoresume"
name = "Herdr Autoresume"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Resume agents and kept commands after herdr restarts: continue interrupted agents, restore idle agents' background work, restart kept commands."
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["node", "src/startup.js"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "src/record.js"]

[[actions]]
id = "toggle-keep"
title = "Keep / stop keeping this pane's command"
contexts = ["pane"]
command = ["node", "src/keep.js"]

[[actions]]
id = "kept-commands"
title = "Show kept commands"
contexts = ["global"]
command = ["node", "src/open-popup.js", "kept-commands"]

[[actions]]
id = "stop-fresh"
title = "Stop herdr and start fresh next time"
contexts = ["global"]
command = ["node", "src/open-popup.js", "stop-fresh"]

[[actions]]
id = "setup-keys"
title = "Add key bindings for Herdr Autoresume to config.toml"
contexts = ["global"]
command = ["node", "src/setup-keys.js"]

[[panes]]
id = "kept-commands"
title = "Kept commands"
placement = "popup"
width = "80%"
height = "60%"
command = ["node", "src/ui-kept.js"]

[[panes]]
id = "stop-fresh"
title = "Stop herdr and start fresh"
placement = "popup"
width = 80
height = 14
command = ["node", "src/ui-stop-fresh.js"]
